spring.application.name=aurahub
spring.profiles.default=local
server.port=${PORT:8080}

# ---- MySQL (override with env vars on the server) ----
spring.datasource.url=${DB_URL:jdbc:mysql://${DB_HOST:localhost}:3306/${DB_NAME:aurahub}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ---- Upload ----
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
app.upload-dir=${UPLOAD_DIR:uploads}

# ---- Mail (Mailtrap / Gmail app password) ----
spring.mail.host=${MAIL_HOST:sandbox.smtp.mailtrap.io}
spring.mail.port=${MAIL_PORT:2525}
spring.mail.username=${MAIL_USER:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from=${MAIL_FROM:no-reply@aurahub.local}

# ---- JWT (secret >= 32 caracteres, a surcharger en production) ----
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-please-0123456789}
app.jwt.expiration-ms=86400000

# ---- Admin cree au premier demarrage ----
app.admin.email=${ADMIN_EMAIL:admin@aura.com}
app.admin.password=${ADMIN_PASSWORD:Admin123!}
app.base-url=${BASE_URL:http://localhost:4200}

# ---- Regles de gestion ----
# RG4 : duree de l'acces anticipe (heures)
app.early-access-hours=48
# RG7 : seuils de cumul d'achats sur 12 mois (parametrables)
app.niveau.prestige=5000
app.niveau.elite=20000

# ---- CORS (dev Angular) ----
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200}
